services:
  n8n:
    image: n8nio/n8n:latest
    container_name: restopro-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Caracas
    volumes:
      - C:/Users/monke/.n8n:/home/node/.n8n
    restart: unless-stopped

  evolution_postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=evo
      - POSTGRES_PASSWORD=evo
      - POSTGRES_DB=evolution
    volumes:
      - ./evolution/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  evolution_redis:
    image: redis:alpine
    container_name: evolution_redis
    restart: always
    ports:
      - "6379:6379"

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=restopro_secret_key_123
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evo:evo@evolution_postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
    volumes:
      - ./evolution/instances:/evolution/instances
      - ./evolution/store:/evolution/store
